<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Box</title>
<link href="https://fonts.googleapis.com/css2?family=Blinker:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d3557;--bg:#f2f7fc;color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{min-height:100vh;color:var(--ink);font-family:'Blinker','Trebuchet MS',sans-serif;
  background:radial-gradient(circle at 8% 6%,#ffe0cc 0,transparent 30%),radial-gradient(circle at 94% 88%,#cfe8ff 0,transparent 34%),radial-gradient(circle at 92% 8%,#d9f5e3 0,transparent 24%),var(--bg)}
body.lock{overflow:hidden}
.app{max-width:1240px;margin:0 auto;padding:2rem 1.25rem 3rem}

/* ---------- nagłówek ---------- */
.top{text-align:center;margin-bottom:1.6rem}
h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:800;line-height:1}
h1 span{background:linear-gradient(90deg,#f26a1b,#d6336c 50%,#0b86d1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hint{font-size:1.15rem;font-weight:400;color:#4a6285;margin:.7rem 0 1.1rem}
.switch,.seg3{display:inline-flex;gap:6px;padding:6px;border-radius:20px;background:#fff;box-shadow:0 5px 0 #c9d6e6;flex-wrap:wrap;justify-content:center}
.switch button,.seg3 button{display:flex;align-items:center;gap:.55rem;padding:.6rem 1.3rem;border-radius:14px;background:transparent;color:var(--ink);font-size:1.2rem;font-weight:700}
.switch button.on,.seg3 button.on{background:var(--ink);color:#fff}
.switch svg{width:24px;height:24px}

/* ---------- przyciski ---------- */
button{font:inherit;border:0;cursor:pointer;color:#fff;transition:transform .15s}
button:hover{transform:scale(1.04)}
button:disabled{opacity:.6;cursor:default;transform:none}

/* ---------- scena ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2rem;align-items:center}
.wheelbox svg{display:block;width:100%;height:auto;cursor:pointer;overflow:visible}
.board{display:none;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.4rem 1.2rem;padding-bottom:10px}
.panel{display:flex;flex-direction:column;gap:1.4rem}
.res{min-height:190px;border-radius:26px;padding:1.6rem 1.8rem;display:flex;flex-direction:column;justify-content:center;background:var(--c,#1d3557);color:#fff;box-shadow:0 10px 0 var(--d,#0d1b2e);transition:background .3s}
.res.has{cursor:pointer}
.res small{font-size:1rem;font-weight:600;opacity:.85}
.res b{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:800;line-height:1.05;margin-top:.35rem}
.res em{font-style:normal;font-size:1rem;font-weight:600;opacity:.85;margin-top:.6rem}
.btns{display:flex;gap:1rem}
.go{flex:1;display:flex;align-items:center;justify-content:center;gap:.7rem;padding:1.05rem 1.5rem;border-radius:20px;font-size:1.5rem;font-weight:700;background:#e5383b;box-shadow:0 7px 0 #a4161a}
.go:active{transform:translateY(3px);box-shadow:0 4px 0 #a4161a}
.ico{width:66px;flex:none;border-radius:20px;background:#1d3557;box-shadow:0 7px 0 #0d1b2e;display:grid;place-items:center}
.go svg,.ico svg{width:30px;height:30px}
.tg{display:flex;align-items:center;gap:.8rem;font-size:1.15rem;font-weight:600;cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;pointer-events:none}
.bx{width:34px;height:34px;flex:none;border-radius:11px;border:3px solid #1d3557;background:#fff;display:grid;place-items:center}
.bx svg{width:22px;height:22px;opacity:0;transform:scale(.4);transition:.15s}
.tg input:checked+.bx{background:#12a150;border-color:#0b6b35}
.tg input:checked+.bx svg{opacity:1;transform:none}
.tg input:focus-visible+.bx{outline:3px solid #0b86d1;outline-offset:2px}
.hist{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{padding:.4rem .9rem;border-radius:99px;font-size:.95rem;font-weight:600;color:#fff;background:var(--c);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{transition:opacity .3s}.seg.used{opacity:.3}
.bulb{animation:bl 1s steps(1) infinite}.bulb.b1{animation-delay:-.5s}
.fast .bulb{animation-duration:.24s}.fast .bulb.b1{animation-delay:-.12s}
@keyframes bl{0%{fill:#ffd23f}50%{fill:#fff}}

/* ---------- plansza ---------- */
.tw{position:relative;transition:transform .15s}
.tw:hover{transform:scale(1.03)}
.tile{position:relative;width:100%;height:100%;overflow:hidden;min-height:156px;padding:1.2rem 1.3rem 1.3rem;border-radius:24px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:.35rem;
  background:var(--c);box-shadow:0 8px 0 var(--d);transition:transform .15s,opacity .3s,filter .3s}
.tile:hover{transform:none}
.tile::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 2px,transparent 2.6px);background-size:20px 20px;
  -webkit-mask-image:linear-gradient(200deg,#000,transparent 55%);mask-image:linear-gradient(200deg,#000,transparent 55%)}
.tile .n{position:absolute;top:.55rem;left:1rem;font-size:3.4rem;font-weight:800;line-height:1;opacity:.28}
.tile .st{position:absolute;top:1.1rem;right:3.9rem;width:26px;height:26px}
.tile b{position:relative;font-size:1.6rem;font-weight:800;line-height:1.05}
.tile small{position:relative;font-size:1.08rem;font-weight:600;opacity:.95;line-height:1.2}
.tile.used{opacity:.38}
.tw.hot{transform:scale(1.07)}
.tw.hot .tile{outline:6px solid #ffd23f;outline-offset:3px;opacity:1}
.off{position:absolute;top:.7rem;right:.7rem;z-index:2;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.26);display:grid;place-items:center}
.off:hover{transform:none}
.off svg{width:26px;height:26px}
.off .e2{display:none}
.tw.dis .tile{filter:grayscale(1);opacity:.42}
.tw.dis .off{background:#1d3557}
.tw.dis .off .e1{display:none}.tw.dis .off .e2{display:block}

/* notka z wyrażeniem */
.exnote{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;border-radius:18px;background:#fff;box-shadow:0 5px 0 #c9d6e6;color:var(--ink);text-align:left;font-size:1.25rem;line-height:1.25}
.exnote svg{flex:none;width:28px;height:28px}
.exnote small{display:block;font-size:.95rem;font-weight:600;color:#4a6285}
.exnote b{font-weight:700}
.exnote[hidden]{display:none}

/* metody */
.methods{display:none;margin-top:2.8rem}
.m-title{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:800;margin-bottom:1.1rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem}
.mtile{display:flex;align-items:center;gap:.9rem;min-height:92px;padding:1rem 1.1rem;border-radius:20px;text-align:left;background:var(--l);color:var(--d);box-shadow:0 6px 0 var(--m)}
.mtile .mi{flex:none;width:50px;height:50px;border-radius:15px;background:var(--c);display:grid;place-items:center}
.mtile .mi svg{width:28px;height:28px;stroke:#fff}
.mtile b{display:block;font-size:1.3rem;font-weight:700;line-height:1.1}
.mtile small{display:block;font-size:1.02rem;font-weight:400;margin-top:.2rem;color:var(--ink)}

/* tryb planszy */
.app.bm .stage{grid-template-columns:1fr}
.app.bm .wheelbox{display:none}
.app.bm .board{display:grid}
.app.bm .panel{order:-1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:1rem 1.6rem}
.app.bm .res{display:none}
.app.bm .btns{flex:0 1 360px}
.app.bm .hist{flex-basis:100%}
.app.bm .exnote{flex:1 1 320px}
.app.bm .methods{display:block}

/* ---------- wyrażenia ---------- */
.expr{display:none;max-width:1000px;margin:0 auto}
.app.em .stage{display:none}
.app.em .expr{display:block}
.data{background:#fff;border-radius:22px;box-shadow:0 6px 0 #c9d6e6;overflow:hidden}
.d-head{width:100%;display:flex;align-items:center;gap:.8rem;padding:1rem 1.3rem;background:transparent;color:var(--ink);font-size:1.3rem;font-weight:700;text-align:left}
.d-head:hover{transform:none}
.d-head>svg{width:28px;height:28px;flex:none}
.d-count{padding:.15rem .75rem;border-radius:99px;background:#e3edf8;font-size:1.05rem;font-weight:700}
.d-head .chev{margin-left:auto;transition:transform .25s}
.data.open .chev{transform:rotate(180deg)}
.d-body{display:none;padding:0 1.3rem 1.3rem}
.data.open .d-body{display:block}
.d-body textarea{display:block;width:100%;min-height:220px;border:0;border-radius:16px;background:#eef4fb;padding:1rem 1.1rem;font:inherit;font-size:1.15rem;line-height:1.45;color:var(--ink);resize:vertical;tab-size:6}
.d-body textarea:focus{outline:3px solid #0b86d1;outline-offset:2px}
.d-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem 1.2rem;margin-top:.8rem}
.d-hint{font-size:1.05rem;color:#4a6285;flex:1 1 320px}
.d-btn{display:flex;align-items:center;gap:.55rem;padding:.65rem 1.15rem;border-radius:14px;background:#1d3557;box-shadow:0 5px 0 #0d1b2e;font-size:1.1rem;font-weight:700}
.d-btn svg{width:24px;height:24px}
.e-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1rem 1.4rem;margin-top:1.5rem}
.seg3 button{font-size:1.1rem;padding:.5rem 1rem}
.seg3 small{font-size:1rem;font-weight:600;opacity:.7}
.e-card{position:relative;overflow:hidden;margin-top:1.6rem;min-height:300px;border-radius:30px;padding:2.2rem 2.4rem;background:var(--ec,#1d3557);box-shadow:0 12px 0 var(--ed,#0d1b2e);color:#fff;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1.1rem;transition:background .7s ease}
.e-card::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 2.4px,transparent 3px);background-size:24px 24px;
  -webkit-mask-image:linear-gradient(160deg,#000,transparent 50%);mask-image:linear-gradient(160deg,#000,transparent 50%);pointer-events:none}
.e-card>*{position:relative}
.e-kind{padding:.25rem .95rem;border-radius:99px;background:rgba(255,255,255,.22);font-size:1.05rem;font-weight:600}
.e-kind:empty{display:none}
.e-main{font-size:clamp(2.2rem,5vw,4rem);font-weight:700;line-height:1.12;overflow-wrap:anywhere}
.e-main.long{font-size:clamp(1.7rem,3.4vw,2.7rem)}
.e-main.pop{animation:epop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes epop{from{transform:scale(.6);opacity:0}}
.e-trans{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:400;opacity:.95;overflow-wrap:anywhere}
.e-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem}
.e-tools button{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.15rem;border-radius:14px;background:rgba(255,255,255,.22);font-size:1.15rem;font-weight:600}
.e-tools button svg{width:24px;height:24px}
.e-tools button[hidden],.e-trans[hidden]{display:none}
.gap{display:inline-block;padding:0 .25em;border-radius:12px;background:rgba(255,255,255,.28);color:transparent;cursor:pointer;transition:color .2s,background .2s}
.gap.open{color:#ffd23f;background:rgba(255,255,255,.12)}
.e-btns{max-width:560px;margin:1.8rem auto 0}
.e-hist{justify-content:center;margin-top:1.2rem}

/* ---------- ekran aktywności ---------- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:clamp(.75rem,2.4vw,2rem);background:var(--c);overflow:hidden}
.ov[hidden]{display:none}
.ov::before{content:'';position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;
  background:repeating-conic-gradient(rgba(255,255,255,.13) 0 7deg,transparent 7deg 18deg);animation:rot 80s linear infinite}
.ov::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(0,0,0,.2))}
@keyframes rot{to{transform:rotate(360deg)}}
.deco svg{position:absolute;z-index:1;opacity:.3;animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(-16px) rotate(var(--r))}to{transform:translateY(16px) rotate(calc(var(--r) + 30deg))}}

.card{position:relative;z-index:2;width:min(1180px,100%);max-height:calc(100vh - 2 * clamp(.75rem,2.4vw,2rem));overflow:auto;overscroll-behavior:contain;
  background:#fff;border-radius:34px;box-shadow:0 16px 0 var(--d);animation:pop .8s cubic-bezier(.2,1.25,.4,1) both}
@keyframes pop{0%{opacity:0;transform:perspective(1400px) rotateX(62deg) scale(.5) translateY(140px)}100%{opacity:1;transform:none}}

.c-head{position:relative;overflow:hidden;display:flex;align-items:center;gap:1.7rem;padding:2.1rem 6rem 2.1rem 2.3rem;background:var(--c);color:#fff}
.c-head::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 2.4px,transparent 3px);background-size:24px 24px;
  -webkit-mask-image:linear-gradient(90deg,transparent 35%,#000);mask-image:linear-gradient(90deg,transparent 35%,#000)}
.c-badge{position:relative;flex:none;width:104px;height:104px;border-radius:30px;background:#fff;color:var(--c);display:grid;place-items:center;
  font-size:3rem;font-weight:800;box-shadow:0 8px 0 var(--d);animation:spinin .9s .15s cubic-bezier(.2,1.4,.4,1) backwards;transform:rotate(-7deg)}
@keyframes spinin{from{transform:rotate(-200deg) scale(.2)}}
.c-titles{position:relative;min-width:0}
.c-head h2{font-size:clamp(2.4rem,5.4vw,4.5rem);font-weight:800;line-height:.98;text-shadow:0 4px 0 rgba(0,0,0,.14)}
.c-head h2 .w{display:inline-block;animation:rise .55s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.7)}}
.c-sub{font-size:clamp(1.25rem,2.2vw,1.65rem);font-weight:600;margin-top:.45rem;opacity:.96}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.85rem}
.tags:empty{display:none}
.tag{padding:.28rem .85rem;border-radius:99px;background:rgba(255,255,255,.24);font-size:1.02rem;font-weight:600}
.x{position:absolute;top:1.2rem;right:1.2rem;z-index:1;width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.25);display:grid;place-items:center}
.x svg{width:30px;height:30px}

.c-body{display:grid;gap:2rem;padding:2rem 2.3rem .4rem}
.c-body.img{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.c-desc{font-size:clamp(1.3rem,2.1vw,1.65rem);font-weight:600;line-height:1.38}
.steps{list-style:none;padding:0;margin-top:1.3rem;display:grid;gap:.8rem;counter-reset:s}
.steps:empty{display:none}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:1rem;align-items:center;font-size:clamp(1.2rem,1.9vw,1.45rem);font-weight:600;line-height:1.3}
.steps li::before{counter-increment:s;content:counter(s);width:48px;height:48px;border-radius:15px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.45rem;font-weight:800;box-shadow:0 4px 0 var(--d)}
.c-end{display:flex;align-items:center;gap:.9rem;margin-top:1.3rem;padding:.95rem 1.2rem;border-radius:20px;background:var(--l);font-size:clamp(1.15rem,1.8vw,1.4rem);line-height:1.35;font-weight:600;color:var(--d)}
.c-end b{font-weight:700}
.c-end svg{flex:none;width:34px;height:34px}
.c-expr{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;padding:.75rem 1.1rem;border-radius:18px;background:var(--l);color:var(--d);font-size:clamp(1.2rem,1.9vw,1.5rem);font-weight:600;line-height:1.3}
.c-expr b{font-weight:700}
.c-expr svg{flex:none;width:30px;height:30px}
.c-expr[hidden],.again[hidden]{display:none}
.c-badge svg{width:56px;height:56px}
.c-why{display:flex;gap:.9rem;align-items:flex-start;margin-top:1.3rem;padding:.95rem 1.2rem;border-radius:20px;background:#edf3fb;color:var(--ink);font-size:clamp(1.1rem,1.7vw,1.3rem);line-height:1.38}
.c-why svg{flex:none;width:32px;height:32px;stroke:var(--c)}
.c-why b{font-weight:700;color:var(--d)}
.c-why[hidden]{display:none}
.c-img img{display:block;width:100%;border-radius:26px;box-shadow:0 9px 0 var(--m)}

/* kontekst: podpowiedź, nie wybór */
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin:1.5rem 2.3rem 0}
.cx{display:grid;grid-template-columns:32px 1fr;gap:.7rem;align-items:start;padding:1rem 1.2rem;border-radius:18px;background:var(--l);font-size:clamp(1.08rem,1.5vw,1.22rem);line-height:1.32}
.cx svg{width:30px;height:30px;stroke:var(--c)}
.cx b{display:block;font-weight:700;color:var(--d)}

/* dopisek „Za trudne?” */
.c-easy{display:flex;align-items:center;gap:.7rem;margin:1.6rem 2.3rem 0;padding:.65rem 1rem;border-radius:16px;background:#fff1c2;color:#6b4700;font-size:1.08rem;line-height:1.35}
.c-easy svg{flex:none;width:26px;height:26px}
.c-easy b{font-weight:700}
.c-end[hidden],.c-easy[hidden],.c-img[hidden],.sec[hidden],.dice[hidden],.ctx[hidden]{display:none}

/* sekcje: warianty, w praktyce */
.sec{padding:1.6rem 2.3rem .4rem}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.1rem}
.s-head h3{font-size:clamp(1.7rem,2.6vw,2.1rem);font-weight:800;color:var(--d)}
.dice{display:flex;align-items:center;gap:.6rem;padding:.75rem 1.3rem;border-radius:18px;background:var(--c);box-shadow:0 6px 0 var(--d);font-size:1.25rem;font-weight:700}
.dice svg{width:30px;height:30px}
.dice.roll svg{animation:shake .25s linear infinite}
@keyframes shake{50%{transform:rotate(25deg)}}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1rem}
.vg{grid-column:1/-1;display:flex;align-items:center;gap:.7rem;font-size:1.35rem;font-weight:700;color:var(--d);margin-top:.35rem}
.vg:first-child{margin-top:0}
.vg span{padding:.15rem .7rem;border-radius:99px;background:var(--l);font-size:.98rem;font-weight:600;color:var(--d)}
.v{display:grid;grid-template-columns:46px 1fr;gap:.9rem;align-items:start;padding:1rem 1.1rem;border-radius:22px;text-align:left;color:var(--ink);background:var(--l);
  font-size:clamp(1.12rem,1.7vw,1.3rem);font-weight:400;line-height:1.3;transition:transform .18s,background .18s,color .18s,opacity .25s;animation:vin .45s ease backwards}
.v:hover{transform:scale(1.02)}
.v b{font-weight:700}
.v .k{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--c);display:grid;place-items:center;font-size:1.35rem;font-weight:800;box-shadow:0 4px 0 var(--m)}
.v .k svg{width:26px;height:26px;stroke:var(--c)}
.v>span:last-child{padding-top:.45rem}
.v.pick{background:var(--c);color:#fff;transform:scale(1.03)}
.v.pick .k{box-shadow:0 4px 0 var(--d)}
.v.dim{opacity:.42}
@keyframes vin{from{opacity:0;transform:translateY(22px)}}

.c-foot{display:flex;justify-content:center;gap:1rem;padding:1.4rem 2.3rem 2.3rem}
.again{display:flex;align-items:center;gap:.7rem;padding:1rem 1.8rem;border-radius:20px;background:#e5383b;box-shadow:0 7px 0 #a4161a;font-size:1.4rem;font-weight:700}
.back{display:flex;align-items:center;gap:.7rem;padding:1rem 1.6rem;border-radius:20px;background:var(--ink);box-shadow:0 7px 0 #0d1b2e;font-size:1.4rem;font-weight:700}
.again svg,.back svg{width:28px;height:28px}

/* ekran STOP */
.stop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:2rem 1.25rem;background:#e5383b;overflow:auto}
.stop[hidden]{display:none}
.stop::before{content:'';position:fixed;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(rgba(255,255,255,.1) 0 7deg,transparent 7deg 18deg);pointer-events:none}
.stop-in{position:relative;z-index:1;width:min(900px,100%);display:flex;flex-direction:column;align-items:center;gap:1.4rem;color:#fff;text-align:center}
.oct{width:min(280px,38vh);height:auto;filter:drop-shadow(0 10px 0 rgba(0,0,0,.22));animation:stopin .75s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stopin{from{opacity:0;transform:scale(.2) rotate(-120deg)}}
.stop h2{font-size:clamp(2.4rem,5.5vw,4rem);font-weight:800;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.stop-list{list-style:none;padding:0;display:grid;gap:.9rem;width:100%;counter-reset:q}
.stop-list li{display:grid;grid-template-columns:54px 1fr;gap:1rem;align-items:center;padding:1rem 1.2rem;border-radius:22px;background:#fff;color:var(--ink);text-align:left;font-size:clamp(1.3rem,2.3vw,1.7rem);font-weight:600;box-shadow:0 7px 0 #a4161a;animation:vin .45s ease backwards}
.stop-list li::before{counter-increment:q;content:counter(q);width:54px;height:54px;border-radius:16px;background:#e5383b;color:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:800}
.stop-why{max-width:760px;font-size:1.15rem;line-height:1.4;opacity:.95}
.stop-why b{font-weight:700}

/* strony */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem}
.ltile{display:flex;align-items:center;gap:.9rem;min-height:84px;padding:.9rem 1.1rem;border-radius:20px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 6px 0 #c9d6e6;transition:transform .15s}
.ltile:hover{transform:scale(1.03)}
.ltile .mi{flex:none;width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center}
.ltile .mi svg{width:24px;height:24px;stroke:#fff}
.ltile b{display:block;font-size:1.22rem;font-weight:700;line-height:1.1}
.ltile small{display:block;font-size:1rem;margin-top:.2rem;color:#4a6285}

@media(max-width:860px){
  .stage{grid-template-columns:1fr}.wheelbox{max-width:560px;margin:0 auto;width:100%}
  .c-head{flex-direction:column;align-items:flex-start;padding:1.6rem 1.4rem;gap:1rem}
  .c-badge{width:78px;height:78px;font-size:2.2rem;border-radius:22px}
  .c-body,.sec{padding-left:1.4rem;padding-right:1.4rem}
  .ctx,.c-easy{margin-left:1.4rem;margin-right:1.4rem}
  .c-body.img,.ctx{grid-template-columns:1fr}
  .vars{grid-template-columns:1fr}
  .s-head{flex-wrap:wrap}
  .e-card{padding:1.6rem 1.3rem}
}
@media(prefers-reduced-motion:reduce){.ov::before,.deco svg{animation:none}}

<body>
<main class="app" id="app">

    </div>
  </header>

  <div class="stage">
    <div class="wheelbox"><svg id="svg" viewBox="0 0 520 560" role="img" aria-label="Koło"></svg></div>

      <div class="btns">

        <button id="reset" class="ico" title="Zacznij od nowa" aria-label="Zacznij od nowa"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
      </div>
      <label class="tg"><input type="checkbox" id="nr"><span class="bx"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>Nie powtarzaj wylosowanych</label>
      <div id="hist" class="hist"></div>
    </aside>
    <section class="methods" id="methods">
      <h2 class="m-title">Metody</h2>
      <div class="mgrid" id="mgrid"></div>
    </section>
    <section class="methods" id="links">
      <h2 class="m-title">Strony</h2>
      <div class="lgrid" id="lgrid"></div>
    </section>
  </div>

  <section class="expr" id="expr">
    <div class="data" id="data">
      <button class="d-head" id="dHead" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        Twoje wyrażenia <span class="d-count" id="dCount">0</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="d-body">
        <textarea id="dText" spellcheck="false" placeholder="spóźnić się na pociąg&#9;to miss the train&#10;Przepraszam, że się spóźniłem.&#9;Sorry I'm late.&#10;mieć dość&#9;to be fed up with"></textarea>

    </div>

    </div>
    <div class="hist e-hist" id="eHist"></div>
  </section>
</main>

<div class="ov" id="ov" hidden>
  <div class="deco" id="deco" aria-hidden="true"></div>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cTitle">

    <div class="c-body" id="cBody">

  </div>
</div>

     nazwa      : tytuł na kole, planszy i ekranie aktywności

     podtytul   : jedna linijka pod tytułem
     opis       : główny opis
     kroki      : lista kroków (numerowane kółka)

     kontekst   : { nowy: "...", notatki: "..." }

     warianty   : lista wariantów. Nagłówki grup:

     tagi       : małe etykiety pod tytułem (opcjonalnie)
     obrazek    : link lub ścieżka do obrazka; puste = brak obrazka

function spinWheel(){
  const{idx}=pickIdx(),slot=active.indexOf(idx);
  const jit=active.length>1?(Math.random()-.5)*SEG*.7:0;
  const start=rot,end=Math.ceil(rot/360)*360+360*(5+Math.floor(Math.random()*3))+((((-(slot+.5)*SEG-jit)%360)+360)%360);
  const dur=5600,t0=performance.now();let last=under(start);
  busy=true;btn.disabled=true;svg.classList.add('fast');
  (function f(now){
    const t=Math.min((now-t0)/dur,1),e=1-Math.pow(1-t,4);
    rot=start+(end-start)*e;setRot(rot);
    const u=under(rot);
    if(u!==last){last=u;ptr.animate([{transform:'rotate(0)'},{transform:'rotate(-22deg)'},{transform:'rotate(0)'}],{duration:110})}
    if(t<1)return requestAnimationFrame(f);
    svg.classList.remove('fast');
    setTimeout(()=>{busy=false;btn.disabled=false;finish(idx)},550);
  })(t0);
}

async function spinBoard(){
  const{idx,pool}=pickIdx();
  busy=true;btn.disabled=true;
  const hops=22;let prev=-1;
  for(let k=0;k<hops;k++){
    let j=idx;
    if(k<hops-1){const c=pool.length>1?pool.filter(x=>x!==prev):pool;j=c[Math.floor(Math.random()*c.length)]}
    wraps.forEach(t=>t.classList.remove('hot'));wraps[j].classList.add('hot');prev=j;
    await sleep(60+Math.pow(k/hops,2)*360);
  }
  await sleep(650);
  wraps[idx].classList.remove('hot');
  busy=false;btn.disabled=false;finish(idx);
}

  if($('nrE').checked){cand=p.filter(i=>!E.used.has(i));if(!cand.length){p.forEach(i=>E.used.delete(i));cand=p}}
  const fin=cand[Math.floor(Math.random()*cand.length)];
  E.busy=true;$('eDraw').disabled=true;$('eKind').textContent='';$('eTrans').hidden=true;$('eShow').hidden=$('eGap').hidden=true;
  const main=$('eMain');
  for(let k=0;k<13;k++){const o=E.items[p[Math.floor(Math.random()*p.length)]];main.className='e-main long';main.textContent=eTexts(o).main;if(k%5===0)eColor();await sleep(45+k*k*2.6)}
  E.cur=fin;E.gap=-1;E.used.add(fin);E.hist=[fin,...E.hist.filter(i=>i!==fin)].slice(0,10);
  eRender(true);ePaintHist();
  E.busy=false;$('eDraw').disabled=false;
}
function ePaintHist(){$('eHist').innerHTML=E.hist.map(i=>`<button class="chip" data-i="${i}" style="--c:#4a6285">${esc(eTexts(E.items[i]).main)}</button>`).join('')}
function eSetData(open){$('data').classList.toggle('open',open);$('dHead').setAttribute('aria-expanded',open)}

$('dText').value=store.get('ruletka-wyrazenia')||'';eParse();eSetData(!E.items.length);eRender();
$('dHead').addEventListener('click',()=>eSetData(!$('data').classList.contains('open')));
$('dSample').addEventListener('click',()=>{
  const t=$('dText');
  if(t.value.trim()&&!confirm('Zastąpić obecną listę przykładowymi wyrażeniami?'))return;
  t.value=PRZYKLADOWE_WYRAZENIA.map(r=>r.join('\t')).join('\n');t.dispatchEvent(new Event('input'));
});
$('dText').addEventListener('input',()=>{store.set('ruletka-wyrazenia',$('dText').value);eParse();eRender()});
$('dText').addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText('\t',s,t.selectionEnd,'end');t.dispatchEvent(new Event('input'))}});
$('eFilter').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;E.filter=b.dataset.f;[...$('eFilter').children].forEach(x=>x.classList.toggle('on',x===b))});
$('eLang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;E.lang=b.dataset.l;[...$('eLang').children].forEach(x=>x.classList.toggle('on',x===b));E.gap=-1;eRender();ePaintHist()});
$('eDraw').addEventListener('click',eDraw);
$('eShow').addEventListener('click',()=>{const t=$('eTrans');t.hidden=!t.hidden;$('eShow').querySelector('span').textContent=t.hidden?'Tłumaczenie':'Ukryj'});
$('eGap').addEventListener('click',()=>{
  const o=E.items[E.cur];if(!o)return;
  if(E.gap>=0){E.gap=-1}else{
    const w=eTexts(o).main.split(/(\s+)/);
    let c=w.map((x,i)=>i).filter(i=>(w[i].match(/[\p{L}\p{N}]/gu)||[]).length>=3);
    if(!c.length)c=w.map((x,i)=>i).filter(i=>/\S/.test(w[i]));
    E.gap=c[Math.floor(Math.random()*c.length)];
  }
  eRender();
});
$('eMain').addEventListener('click',e=>{const g=e.target.closest('.gap');if(g)g.classList.toggle('open')});
$('eHist').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||E.busy)return;E.cur=+c.dataset.i;E.gap=-1;eRender(true)});
$('eReset').addEventListener('click',()=>{if(E.busy)return;E.used.clear();E.hist=[];E.cur=-1;E.gap=-1;eRender();ePaintHist()});

/* ---------- tryby ---------- */
const HINT={wheel:'Kliknij koło albo przycisk, żeby zakręcić.',board:'Kliknij kafelek, żeby wybrać, albo wylosuj. Oko wyłącza zadanie z losowania.',expr:'Wklej wyrażenia, zwiń panel i losuj.'};
function setMode(m){
  mode=m;app.classList.toggle('bm',m==='board');app.classList.toggle('em',m==='expr');
  $('mWheel').classList.toggle('on',m==='wheel');$('mBoard').classList.toggle('on',m==='board');$('mExpr').classList.toggle('on',m==='expr');
  $('spinTxt').textContent=m==='wheel'?'Zakręć':'Losuj';
  $('hint').textContent=HINT[m];
  store.set('ruletka-tryb',m);
}

/* ---------- zdarzenia ---------- */
svg.addEventListener('click',spin);btn.addEventListener('click',spin);nr.addEventListener('change',paint);
$('mWheel').addEventListener('click',()=>{if(!busy)setMode('wheel')});
$('mBoard').addEventListener('click',()=>{if(!busy)setMode('board')});
$('mExpr').addEventListener('click',()=>{if(!busy)setMode('expr')});
board.addEventListener('click',e=>{
  if(busy)return;
  const o=e.target.closest('.off');
  if(o){const i=+o.dataset.i;off.has(i)?off.delete(i):off.add(i);used.delete(i);store.set('ruletka-wylaczone',JSON.stringify([...off].map(i=>A[i].nazwa)));buildWheel();paint();return}
  const t=e.target.closest('.tile');if(t)finish(+t.dataset.i);
});
hist.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c&&!busy)openCard(+c.dataset.i)});
res.addEventListener('click',()=>{if(order.length&&!busy)openCard(order[0])});
$('dice').addEventListener('click',rollVariants);
$('cClose').addEventListener('click',closeCard);$('cBack').addEventListener('click',closeCard);
$('cAgain').addEventListener('click',()=>{closeCard();setTimeout(spin,250)});
ov.addEventListener('click',e=>{if(e.target===ov)closeCard()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeCard()});
$('reset').addEventListener('click',()=>{if(busy)return;used.clear();order=[];res.style.removeProperty('--c');res.style.removeProperty('--d');res.classList.remove('has');res.innerHTML='<b>Co dziś robimy?</b>';paint()});

$('mgrid').innerHTML=MT.map((m,j)=>`<button class="mtile" data-m="${j}" style="--c:${m.c};--d:${m.d};--l:${m.l};--m:${m.m}"><span class="mi">${ico(m.ikona)}</span><span><b>${m.nazwa}</b>${m.podtytul?`<small>${m.podtytul}</small>`:''}</span></button>`).join('');
$('mgrid').addEventListener('click',e=>{const t=e.target.closest('.mtile');if(t&&!busy){const m=MT[+t.dataset.m];m.stop?openStop(m):showCard(m,ico(m.ikona),true)}});
function openStop(m){
  $('stopTitle').textContent=m.podtytul||m.nazwa;
  $('stopList').innerHTML=(m.polecenia||[]).map((p,k)=>`<li style="animation-delay:${.5+k*.12}s">${md(p)}</li>`).join('');
  $('stopWhy').innerHTML=m.dlaczego?`<b>Dlaczego to działa?</b> ${md(m.dlaczego)}`:'';
  const o=$('stopOv');o.hidden=false;document.body.classList.add('lock');
  const oc=o.querySelector('.oct');oc.style.animation='none';oc.offsetWidth;oc.style.animation='';
  $('stopBack').focus({preventScroll:true});
}
function closeStop(){$('stopOv').hidden=true;document.body.classList.remove('lock')}
$('stopBack').addEventListener('click',closeStop);
$('stopOv').addEventListener('click',e=>{if(e.target===$('stopOv'))closeStop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('stopOv').hidden)closeStop()});
const I_LINK='<svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
$('lgrid').innerHTML=STRONY.map((l,j)=>`<a class="ltile" href="${esc(l.url)}" target="_blank" rel="noopener" style="--c:${PALETA[(j+3)%PALETA.length]}"><span class="mi">${I_LINK}</span><span><b>${esc(l.nazwa)}</b>${l.opis?`<small>${esc(l.opis)}</small>`:''}</span></a>`).join('');
$('exNote').addEventListener('click',()=>{if(!busy)setMode('expr')});
buildWheel();paint();
const savedMode=store.get('ruletka-tryb');if(savedMode==='board'||savedMode==='expr')setMode(savedMode);
</script>
</body>
</html>
